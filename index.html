<script>
    const mypath = document.querySelector("path");

    const pathLength = mypath.getTotalLength();

    const RocketPosition = document.querySelector("#rocket");
    const space = document.querySelector("#space");

    let progress = 0;
    let targetProgress = 0;

    const smoothness = 0.08;

    function getPointAtProgress(progress) {

        const length = progress * pathLength;

        return mypath.getPointAtLength(length);
    }

    function getRocketAngle(progress) {

        const currentLength = progress * pathLength;

        const pointA =
            mypath.getPointAtLength(currentLength);

        const lookAhead =
            Math.min(currentLength + 2, pathLength);

        const pointB =
            mypath.getPointAtLength(lookAhead);


        const dx = pointB.x - pointA.x;
        const dy = pointB.y - pointA.y;

        const angle =
            Math.atan2(dy, dx) * (180 / Math.PI);

        return angle - -90;
    }

    function getCameraLimits() {

        const viewportWidth = window.innerWidth;

        const worldWidth = space.offsetWidth;

        const maxCameraX =
            Math.max(0, worldWidth - viewportWidth);


        return {
            min: 0,
            max: maxCameraX
        };
    }

    function render() {

        progress +=
            (targetProgress - progress) * smoothness;

        if (
            Math.abs(targetProgress - progress)
            < 0.00001
        ) {
            progress = targetProgress;
        }

        const point =
            getPointAtProgress(progress);

        const angle =
            getRocketAngle(progress);

        RocketPosition.style.left =
            point.x + "px";

        RocketPosition.style.top =
            point.y + "px";

        RocketPosition.style.transform =
            `translate(-50%, -50%) rotate(${angle}deg)`;

        const viewportWidth =
            window.innerWidth;


        let cameraX =
            point.x - (viewportWidth / 2);

        const cameraLimits =
            getCameraLimits();


        cameraX =
            Math.max(
                cameraLimits.min,
                Math.min(
                    cameraLimits.max,
                    cameraX
                )
            );

        space.style.transform =
            `translateX(${-cameraX}px)`;

        requestAnimationFrame(render);
    }

    progress = 0;
    targetProgress = 0;

    render();

    window.addEventListener(
        "wheel",
        function(event) {

            event.preventDefault();

            targetProgress +=
                event.deltaY * 0.0005;

            targetProgress =
                Math.min(
                    1,
                    Math.max(
                        0,
                        targetProgress
                    )
                );

        },
        {
            passive: false
        }
    );

    window.addEventListener(
        "keydown",
        function(event) {

            const step = 0.02;


            if (
                event.key === "a" ||
                event.key === "ArrowLeft"
            ) {

                targetProgress -= step;

            }


            else if (
                event.key === "d" ||
                event.key === "ArrowRight"
            ) {

                targetProgress += step;

            }


            targetProgress =
                Math.min(
                    1,
                    Math.max(
                        0,
                        targetProgress
                    )
                );

        }
    );
